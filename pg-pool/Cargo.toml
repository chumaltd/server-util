[package]
name = "pg-pool"
version = "0.8.1"
rust-version = "1.85"
edition.workspace = true
authors.workspace = true

[dependencies]
deadpool-postgres = "0.14"
log = "0.4"
server-conf = { path = "../server-conf" }
tokio = { version = "1", features = ["time"] }
tokio-postgres = { version = "0.7" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
