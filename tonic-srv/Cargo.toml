[package]
name = "tonic-srv"
version = "0.2.2"
authors.workspace = true
edition.workspace = true

[features]
default = ["otel"]
test-support = ["tokio/rt", "tokio/time"]
otel = [
    "dep:env_logger",
    "dep:log",
    "dep:opentelemetry-appender-log",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "tokio/rt",
]

[dependencies]
env_logger = { version = "0.11", optional = true }
log = { version = "0.4", features = ["std"], optional = true }
opentelemetry-appender-log = { version = "0.33", optional = true }
server-conf = { path = "../server-conf" }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "tls-roots", "logs", "trace"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["logs", "trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-opentelemetry = { version = "0.34", default-features = false, optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "registry"], optional = true }
signal-hook = "0.4"
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }
tokio = { version = "1", features = ["macros", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-aws-lc"] }
triggered = "0.1.2"
